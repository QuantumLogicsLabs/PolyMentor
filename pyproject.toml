[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polymentor"
version = "0.1.0"
description = "Groq-powered coding mentor API and PolyCode training pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "groq>=1.4.0",
    "pydantic>=2.7",
    "pymongo>=4.16.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "tree-sitter>=0.25.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "uvicorn[standard]>=0.30.0",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "src.api.app:app"
