name: PolyMentor PR Reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - name: Install dependencies
        run: pip install -e ".[dev]"
        
      - name: Generate PR Diff

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          
      - name: Analyze PR with PolyMentor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/analyze_pr.py pr_diff.txt --output pr_comment.md --json-summary pr_summary.json
        
      - name: Post PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: polymentor-review
          path: pr_comment.md

      - name: Upload PR Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: polymentor-pr-review
          path: |
            pr_diff.txt
            pr_comment.md
            pr_summary.json
          retention-days: 14


