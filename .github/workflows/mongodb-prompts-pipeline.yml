name: MongoDB Prompts Pipeline #This workflow is used to export the prompts(collection) from the MongoDB database to a JSON file.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum MongoDB documents to export. Use 0 for all."
        required: false
        default: "0"
      only_liked:
        description: "Export only liked conversations."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Hourly. Was every 5 minutes, which meant 288 unbounded scans/day of a
    # live production collection for no real freshness benefit.
    - cron: "0 * * * *"

jobs:
  export-prompts:
    runs-on: ubuntu-latest #GitHub creates a temporary Linux machine to run the workflow.
    timeout-minutes: 20 #The workflow will be killed if it runs for more than 20 minutes.

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }} #This is the MongoDB URI.
      MONGODB_DB: polycode #This is the MongoDB database.
      MONGODB_COLLECTION: prompts #This is the MongoDB collection.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4 #This is the action to checkout the repository.

      - name: Set up Python
        uses: actions/setup-python@v5 #This is the action to setup the Python environment.
        with:
          python-version: "3.12" #This is the Python version to use.

      - name: Install exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Export and clean MongoDB prompt conversations
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          ONLY_LIKED="${{ github.event.inputs.only_liked || 'false' }}"
          ARGS=(--database "$MONGODB_DB" --collection "$MONGODB_COLLECTION" --limit "$LIMIT")
          if [ "$ONLY_LIKED" = "true" ]; then
            ARGS+=(--only-liked)
          fi
          python scripts/export_mongodb_prompts.py "${ARGS[@]}"           #This is the command to export the MongoDB prompt conversations. It is a shell script.

      - name: Remove generated caches and report large folders
        run: python scripts/maintenance_cleanup.py --min-mb 50 #This is the command to remove the generated caches and report the large folders. It is a shell script.

      - name: Upload cleaned prompt dataset
        uses: actions/upload-artifact@v4 #This is the action to upload the cleaned prompt dataset.
        with:
          name: mongodb-prompts #This is the name of the artifact.
          path: data/processed/mongodb_prompts.json #This file contains all exported conversations.
          if-no-files-found: error #This is the condition to check if the artifact is found. If not, the workflow will fail.    
