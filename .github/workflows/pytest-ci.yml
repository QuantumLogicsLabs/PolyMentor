name: Pytest CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_and_triage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        id: run_tests
        run: |
          pytest -v > pytest_output.txt 2>&1
        continue-on-error: true

      - name: Fail the step early if tests failed and we are not in a PR
        if: steps.run_tests.outcome != 'success' && github.event_name != 'pull_request'
        run: exit 1

      - name: Triage Failure with Groq
        if: steps.run_tests.outcome != 'success' && github.event_name == 'pull_request'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/ci_fail_triage.py pytest_output.txt > triage_output.md

      - name: Post Triage Comment to PR
        if: steps.run_tests.outcome != 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file triage_output.md

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1
